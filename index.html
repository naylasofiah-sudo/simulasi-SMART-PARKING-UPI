<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART PARKING UPI – Parking Simulator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,system-ui,sans-serif}
  body{background:#050e17;min-height:100vh;overflow-x:hidden;color:#fff}

  /* ===== TOP HUD (seperti game) ===== */
  .hud{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:linear-gradient(180deg,rgba(5,20,32,.95),rgba(5,20,32,.75));backdrop-filter:blur(10px);border-bottom:1px solid #1a3a52;gap:14px;flex-wrap:wrap}
  .hud-left{display:flex;align-items:center;gap:14px}
  .logo{font-size:1.1rem;font-weight:800;letter-spacing:1.5px;display:flex;align-items:center;gap:8px}
  .logo span{background:linear-gradient(135deg,#2d9cdb,#1f6e9e);font-size:.6rem;padding:4px 10px;border-radius:20px;letter-spacing:1px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

  .hud-stats{display:flex;gap:10px;flex-wrap:wrap}
  .hud-chip{background:#0c2233;border:1px solid #1c3d56;border-radius:12px;padding:6px 14px;display:flex;flex-direction:column;min-width:80px}
  .hud-chip .lbl{font-size:.55rem;text-transform:uppercase;letter-spacing:1px;color:#6c8da8;font-weight:700}
  .hud-chip .val{font-size:1.15rem;font-weight:800;line-height:1.1}
  .hud-chip .val.green{color:#2ecc71}
  .hud-chip .val.blue{color:#2d9cdb}
  .hud-chip .val.orange{color:#f1c40f}

  /* ===== SCENE (GEDUNG PARKIR) ===== */
  .scene-wrap{position:relative;width:100%;max-width:1500px;margin:0 auto;padding:30px 20px 20px;min-height:calc(100vh - 90px);display:flex;justify-content:center}

  .building{position:relative;width:100%;max-width:1200px;background:linear-gradient(180deg,#0a1826,#061019);border-radius:14px 14px 4px 4px;border:2px solid #1c3d56;box-shadow:0 30px 80px -20px #000,inset 0 0 100px #00000080;padding:14px 14px 26px;margin-top:10px}
  .building::before{content:'UPI SMART PARKING';position:absolute;top:-32px;left:50%;transform:translateX(-50%);font-size:.75rem;letter-spacing:6px;color:#2d9cdb;font-weight:800;text-shadow:0 0 20px #2d9cdb88;white-space:nowrap}
  .building::after{content:'';position:absolute;bottom:-6px;left:-6px;right:-6px;height:8px;background:linear-gradient(90deg,#0f2a3f,#1f6e9e,#0f2a3f);border-radius:0 0 10px 10px;box-shadow:0 6px 20px #1f6e9e66}

  /* ===== FLOOR ROW ===== */
  .floor-row{position:relative;display:flex;align-items:stretch;margin-bottom:8px;border-radius:8px;background:#0d1f2e;border:1px solid #1a3a52;overflow:hidden;transition:box-shadow .3s}
  .floor-row.led-hijau{box-shadow:inset 4px 0 0 #2ecc71,0 0 24px #2ecc7133}
  .floor-row.led-kuning{box-shadow:inset 4px 0 0 #f1c40f,0 0 24px #f1c40f33}
  .floor-row.led-merah{box-shadow:inset 4px 0 0 #e74c3c,0 0 24px #e74c3c33}

  /* label lantai di kiri */
  .floor-label{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;background:linear-gradient(90deg,#08141f,#0d1f2e);border-right:1px solid #1a3a52;gap:3px;z-index:3}
  .floor-label .num{font-size:.95rem;font-weight:800;letter-spacing:.5px}
  .floor-label .led{width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 10px currentColor}
  .floor-row.led-hijau .led{background:#2ecc71;color:#2ecc71}
  .floor-row.led-kuning .led{background:#f1c40f;color:#f1c40f}
  .floor-row.led-merah .led{background:#e74c3c;color:#e74c3c}
  .floor-label .pct{font-size:.6rem;color:#6c8da8;font-weight:700}

  /* area slot + jalan */
  .floor-area{flex:1;position:relative;min-height:76px;background:repeating-linear-gradient(90deg,transparent 0 58px,#0f2536 58px 60px)}
  .lane{position:absolute;bottom:0;left:0;right:0;height:18px;background:linear-gradient(180deg,#0a1a24,#071320);border-top:1px dashed #2d9cdb44}
  .lane::after{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,#f1c40f 0 10px,transparent 10px 22px);opacity:.4;transform:translateY(-50%)}

  .slots{position:absolute;top:4px;left:4px;right:4px;bottom:18px;display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
  .slot{position:relative;border-radius:4px;transition:background .2s}
  .slot.kosong{background:#0f2938;border:1px dashed #255070}
  .slot.terisi{background:linear-gradient(145deg,#2d9cdb,#1a6b9e);border:1px solid #7ac4f0;box-shadow:0 0 8px #2d9cdb66}
  .slot .veh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

  /* === KENDARAAN BERGERAK === */
  .vehicle{position:absolute;font-size:1.15rem;z-index:20;pointer-events:none;transition:all linear;filter:drop-shadow(0 2px 6px #00000099)}
  .vehicle.car{font-size:1.25rem}
  .vehicle.motor{font-size:1rem}

  /* === RAMP antar lantai === */
  .ramp{position:absolute;right:80px;width:24px;height:8px;background:linear-gradient(180deg,#1f6e9e,#0a1a24);z-index:2;border-radius:2px}
  .ramp::after{content:'▸';position:absolute;right:-6px;top:-5px;color:#2d9cdb;font-size:.7rem}

  /* gerbang bawah */
  .gate-bottom{position:absolute;bottom:-2px;left:18px;font-size:1rem;z-index:5;opacity:.8}
  .gate-label{position:absolute;bottom:22px;left:12px;font-size:.55rem;color:#2d9cdb;letter-spacing:1.5px;font-weight:800;z-index:5;background:#0a1a24;padding:2px 6px;border-radius:3px;border:1px solid #1a3a52}

  /* ===== BOTTOM CONTROL BAR (seperti game) ===== */
  .controls{position:sticky;bottom:0;z-index:100;display:flex;justify-content:center;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(0deg,rgba(5,20,32,.98),rgba(5,20,32,.8));backdrop-filter:blur(10px);border-top:1px solid #1a3a52;flex-wrap:wrap;margin-top:10px}
  .ctrl-btn{background:#0e2a3f;border:1px solid #23506e;color:#e0f0ff;border-radius:50px;padding:11px 20px;font-weight:700;font-size:.85rem;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px -6px #000}
  .ctrl-btn:hover{background:#143b56;border-color:#2d9cdb;transform:translateY(-2px)}
  .ctrl-btn:active{transform:scale(.95)}
  .ctrl-btn.primary{background:linear-gradient(135deg,#2d9cdb,#1f6e9e);border-color:#6ab8f0;box-shadow:0 8px 22px -6px #2d9cdb99}
  .ctrl-btn.primary:hover{background:linear-gradient(135deg,#3fb0ef,#2d9cdb)}
  .ctrl-btn.danger{background:linear-gradient(135deg,#c0392b,#8e2a1f);border-color:#e74c3c;color:#ffd5cf}

  .ctrl-select{background:#0a1f2e;border:1px solid #23506e;color:#fff;padding:11px 16px;border-radius:50px;font-size:.85rem;font-weight:700;cursor:pointer;outline:none}
  .ctrl-select:focus{border-color:#2d9cdb}

  .auto-pill{display:flex;align-items:center;gap:8px;background:#0a1f2e;border:1px solid #23506e;border-radius:50px;padding:6px 8px 6px 16px;font-size:.8rem;font-weight:700;color:#8ab0cf}
  .switch{position:relative;width:44px;height:24px;background:#0a1f2e;border-radius:40px;border:1px solid #23506e;cursor:pointer;transition:.25s;flex-shrink:0}
  .switch.active{background:#1f6e46;border-color:#2ecc71}
  .switch::after{content:'';position:absolute;width:18px;height:18px;background:#7fa4c4;border-radius:50%;top:2px;left:2px;transition:.25s}
  .switch.active::after{left:22px;background:#d4ffe6}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:#0e2536;border:1px solid #2d9cdb;color:#dbeaf6;padding:11px 22px;border-radius:40px;font-size:.85rem;font-weight:700;box-shadow:0 12px 30px -6px #000,0 0 20px #2d9cdb44;opacity:0;transition:.35s;z-index:9999;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.error{border-color:#e74c3c}
  .toast.success{border-color:#2ecc71}

  @media(max-width:900px){
    .floor-label{flex:0 0 56px}
    .floor-label .num{font-size:.75rem}
    .slot .veh{font-size:.65rem}
    .vehicle{font-size:.95rem}
    .hud-chip{min-width:60px;padding:5px 10px}
    .hud-chip .val{font-size:.95rem}
    .ramp{right:50px}
  }
</style>
</head>
<body>

<!-- HUD ATAS seperti game -->
<div class="hud">
  <div class="hud-left">
    <div class="logo">🚗 SMART PARKING UPI <span>SIMULATOR</span></div>
  </div>
  <div class="hud-stats">
    <div class="hud-chip"><span class="lbl">Total</span><span class="val blue" id="hudTotal">60</span></div>
    <div class="hud-chip"><span class="lbl">Terisi</span><span class="val orange" id="hudOccupied">0</span></div>
    <div class="hud-chip"><span class="lbl">Kosong</span><span class="val green" id="hudAvailable">60</span></div>
    <div class="hud-chip"><span class="lbl">Isi</span><span class="val blue" id="hudPercent">0%</span></div>
  </div>
</div>

<!-- SCENE gedung -->
<div class="scene-wrap">
  <div class="building" id="building">
    <!-- lantai di-generate JS -->
    <div class="gate-bottom">🚧</div>
    <div class="gate-label">GERBANG</div>
  </div>
</div>

<!-- KONTROL BAWAH seperti game -->
<div class="controls">
  <select class="ctrl-select" id="floorSelector">
    <option value="0">Lantai 1</option>
    <option value="1">Lantai 2</option>
    <option value="2">Lantai 3</option>
  </select>
  <button class="ctrl-btn primary" id="enterBtn">⬆ Kendaraan Masuk</button>
  <button class="ctrl-btn" id="exitBtn">⬇ Kendaraan Keluar</button>
  <div class="auto-pill">
    <span>Auto</span>
    <div class="switch" id="autoSwitch"></div>
  </div>
  <button class="ctrl-btn danger" id="resetAllBtn">⟲ Reset</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const CAP = 20, FLOORS = 3;
  let slots = [Array(CAP).fill(null), Array(CAP).fill(null), Array(CAP).fill(null)];
  let autoInterval = null, autoActive = false;

  const $ = id => document.getElementById(id);
  const buildingEl = $('building');
  const hudTotal = $('hudTotal');
  const hudOccupied = $('hudOccupied');
  const hudAvailable = $('hudAvailable');
  const hudPercent = $('hudPercent');
  const floorSelector = $('floorSelector');
  const enterBtn = $('enterBtn');
  const exitBtn = $('exitBtn');
  const autoSwitch = $('autoSwitch');
  const resetAllBtn = $('resetAllBtn');
  const toastEl = $('toast');

  let toastTimer;
  function showToast(msg, type='info') {
    toastEl.textContent = msg;
    toastEl.className = 'toast show ' + (type==='error'?'error':type==='success'?'success':'');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2000);
  }
  function vibrate(ms=30){ if(navigator.vibrate) navigator.vibrate(ms); }

  let audioCtx;
  function beep(freq=660, dur=0.08, type='sine') {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if (audioCtx.state==='suspended') audioCtx.resume();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(0.05, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+dur);
    } catch(e){}
  }

  const countOccupied = fi => slots[fi].filter(v=>v!==null).length;
  const totalOccupied = () => slots.reduce((s,f)=>s+f.filter(v=>v!==null).length,0);
  const findEmpty = fi => slots[fi].indexOf(null);

  // ===== RENDER =====
  function render() {
    const total = totalOccupied();
    const cap = CAP*FLOORS;
    const avail = cap-total;
    const pct = Math.round(total/cap*100);
    hudTotal.textContent = cap;
    hudOccupied.textContent = total;
    hudAvailable.textContent = avail;
    hudPercent.textContent = pct+'%';

    // hapus semua floor-row lama, sisipkan ulang sebelum gate
    buildingEl.querySelectorAll('.floor-row').forEach(e=>e.remove());

    let html = '';
    for (let i=FLOORS-1; i>=0; i--) {
      const occ = countOccupied(i);
      const percent = Math.round(occ/CAP*100);
      let led='led-hijau';
      if (percent>90) led='led-merah';
      else if (percent>70) led='led-kuning';

      let slotHtml='';
      for (let s=0;s<CAP;s++){
        const v = slots[i][s];
        const filled = v!==null;
        const icon = filled ? (v==='motor'?'🏍️':'🚗') : '';
        slotHtml += `<div class="slot ${filled?'terisi':'kosong'}" data-floor="${i}" data-slot="${s}" data-filled="${filled}">${filled?`<span class="veh">${icon}</span>`:''}</div>`;
      }

      html += `
        <div class="floor-row ${led}" data-floor="${i}" id="floor-${i}">
          <div class="floor-label">
            <div class="led"></div>
            <div class="num">L${i+1}</div>
            <div class="pct">${percent}%</div>
          </div>
          <div class="floor-area">
            <div class="slots" id="slots-${i}">${slotHtml}</div>
            <div class="lane"></div>
            ${i<FLOORS-1?'<div class="ramp" style="bottom:8px"></div>':''}
          </div>
        </div>`;
    }
    // sisipkan di paling awal building
    const gate = buildingEl.querySelector('.gate-bottom');
    gate.insertAdjacentHTML('beforebegin', html);

    // attach click slot
    buildingEl.querySelectorAll('.slot').forEach(slot=>{
      slot.addEventListener('click', ()=>handleSlotClick(slot));
    });
  }

  // ===== ANIMASI KENDARAAN NAIK DARI GERBANG BAWAH KE LANTAI =====
  function animateEnter(floorIdx, slotIdx, vt) {
    const floorRow = document.getElementById(`floor-${floorIdx}`);
    const slotsEl = document.getElementById(`slots-${floorIdx}`);
    if (!floorRow || !slotsEl) { commitEnter(floorIdx, slotIdx, vt); return; }
    const targetSlot = slotsEl.querySelector(`.slot[data-slot="${slotIdx}"]`);
    if (!targetSlot) { commitEnter(floorIdx, slotIdx, vt); return; }

    const bRect = buildingEl.getBoundingClientRect();
    const fRect = floorRow.getBoundingClientRect();
    const sRect = targetSlot.getBoundingClientRect();

    const icon = vt==='motor'?'🏍️':'🚗';
    const veh = document.createElement('div');
    veh.className = 'vehicle ' + vt;
    veh.textContent = icon;
    // posisi awal: gerbang bawah gedung
    const startX = bRect.left + 30 - bRect.left; // relatif ke gedung
    const startY = bRect.bottom - 40 - bRect.top;
    veh.style.left = startX + 'px';
    veh.style.top = startY + 'px';
    veh.style.opacity = '0';
    buildingEl.appendChild(veh);

    const targetX = sRect.left - bRect.left + sRect.width/2 - 8;
    const targetY = sRect.top - bRect.top + sRect.height/2 - 8;

    // jalur: dari gerbang (kiri bawah) -> naik ke ketinggian lantai -> horizontal ke slot
    const laneY = fRect.bottom - bRect.top - 12;

    // step 0: muncul
    requestAnimationFrame(()=>{
      veh.style.opacity='1';
      veh.style.transition='left 0.6s ease-in-out, top 0.5s ease-in-out';
      veh.style.left = (bRect.left + 40 - bRect.left) + 'px';
      veh.style.top = laneY + 'px';
      beep(500, 0.06, 'triangle');
    });

    // step 1: horizontal ke kolom slot
    setTimeout(()=>{
      veh.style.transition='left 0.7s ease-in-out';
      veh.style.left = targetX + 'px';
    }, 620);

    // step 2: masuk ke slot
    setTimeout(()=>{
      veh.style.transition='top 0.4s ease-out';
      veh.style.top = targetY + 'px';
      beep(780, 0.08);
    }, 1350);

    // step 3: selesai
    setTimeout(()=>{
      veh.remove();
      commitEnter(floorIdx, slotIdx, vt);
    }, 1800);
  }

  function commitEnter(floorIdx, slotIdx, vt) {
    if (slots[floorIdx][slotIdx]===null) slots[floorIdx][slotIdx]=vt;
    render();
    vibrate(25);
  }

  // ===== ANIMASI KELUAR =====
  function animateExit(floorIdx, slotIdx, vt) {
    const floorRow = document.getElementById(`floor-${floorIdx}`);
    const slotsEl = document.getElementById(`slots-${floorIdx}`);
    if (!floorRow || !slotsEl) { commitExit(floorIdx, slotIdx); return; }
    const targetSlot = slotsEl.querySelector(`.slot[data-slot="${slotIdx}"]`);
    if (!targetSlot) { commitExit(floorIdx, slotIdx); return; }

    const bRect = buildingEl.getBoundingClientRect();
    const fRect = floorRow.getBoundingClientRect();
    const sRect = targetSlot.getBoundingClientRect();

    const icon = vt==='motor'?'🏍️':'🚗';
    const veh = document.createElement('div');
    veh.className='vehicle ' + vt;
    veh.textContent = icon;
    veh.style.left = (sRect.left-bRect.left+sRect.width/2-8)+'px';
    veh.style.top = (sRect.top-bRect.top+sRect.height/2-8)+'px';
    veh.style.transition='none';
    buildingEl.appendChild(veh);

    // kosongkan dulu di state biar icon slot hilang
    commitExit(floorIdx, slotIdx, true);

    const laneY = fRect.bottom - bRect.top - 12;
    const exitX = bRect.left + 20 - bRect.left;

    // step 1: turun ke lane
    requestAnimationFrame(()=>{
      veh.style.transition='top 0.35s ease-out';
      veh.style.top = laneY + 'px';
      beep(450,0.08,'triangle');
    });

    // step 2: keluar ke gerbang kiri bawah (turun terus ke bawah gedung)
    setTimeout(()=>{
      veh.style.transition='left 0.6s ease-in-out, top 0.5s ease-in-out, opacity 0.3s';
      veh.style.left = exitX + 'px';
      veh.style.top = (bRect.height - 30) + 'px';
      veh.style.opacity='0.2';
    }, 380);

    setTimeout(()=>veh.remove(), 1100);
    vibrate(25);
  }

  function commitExit(floorIdx, slotIdx, silent=false) {
    slots[floorIdx][slotIdx] = null;
    render();
    if (!silent) beep(480,0.08,'triangle');
  }

  // ===== CLICK SLOT =====
  function handleSlotClick(slot) {
    const fi = parseInt(slot.dataset.floor,10);
    const si = parseInt(slot.dataset.slot,10);
    const filled = slots[fi][si]!==null;
    if (filled) {
      const vt = slots[fi][si];
      showToast(`⬇️ ${vt==='motor'?'Motor':'Mobil'} keluar Lantai ${fi+1}`,'success');
      animateExit(fi, si, vt);
    } else {
      const vt = Math.random()<0.3?'motor':'car';
      showToast(`⬆️ ${vt==='motor'?'Motor':'Mobil'} masuk Lantai ${fi+1}`,'success');
      animateEnter(fi, si, vt);
    }
  }

  // ===== TOMBOL MASUK =====
  function addVehicleAuto(fi) {
    if (fi<0||fi>=FLOORS) return false;
    const empty = findEmpty(fi);
    if (empty===-1) return false;
    const vt = Math.random()<0.3?'motor':'car';
    showToast(`⬆️ ${vt==='motor'?'Motor':'Mobil'} masuk Lantai ${fi+1}`,'success');
    animateEnter(fi, empty, vt);
    return true;
  }

  function removeVehicle(fi) {
    if (fi<0||fi>=FLOORS) return false;
    let idx=-1;
    for (let s=CAP-1;s>=0;s--){ if(slots[fi][s]!==null){idx=s;break;} }
    if (idx===-1) return false;
    const vt = slots[fi][idx];
    showToast(`⬇️ ${vt==='motor'?'Motor':'Mobil'} keluar Lantai ${fi+1}`,'success');
    animateExit(fi, idx, vt);
    return true;
  }

  function resetAll() {
    slots = [Array(CAP).fill(null),Array(CAP).fill(null),Array(CAP).fill(null)];
    if (autoActive) stopAuto();
    render();
    beep(500,0.15,'sine');
    showToast('⟲ Semua data direset','info');
  }

  // ===== AUTO =====
  function startAuto() {
    if (autoInterval) clearInterval(autoInterval);
    autoActive = true;
    autoSwitch.classList.add('active');
    showToast('▶ Simulasi otomatis aktif','info');
    autoInterval = setInterval(()=>{
      const fi = Math.floor(Math.random()*FLOORS);
      const doEnter = Math.random()<0.6;
      if (doEnter) {
        let target=-1;
        for (let i=0;i<FLOORS;i++){ const idx=(fi+i)%FLOORS; if(findEmpty(idx)!==-1){target=idx;break;} }
        if (target!==-1) {
          const empty = findEmpty(target);
          const vt = Math.random()<0.3?'motor':'car';
          animateEnter(target, empty, vt);
        } else {
          for (let i=0;i<FLOORS;i++){
            const idx=(fi+i)%FLOORS;
            let found=-1; for(let s=CAP-1;s>=0;s--){if(slots[idx][s]!==null){found=s;break;}}
            if (found!==-1){ animateExit(idx,found,slots[idx][found]); break; }
          }
        }
      } else {
        let done=false;
        for (let i=0;i<FLOORS;i++){
          const idx=(fi+i)%FLOORS;
          let found=-1; for(let s=CAP-1;s>=0;s--){if(slots[idx][s]!==null){found=s;break;}}
          if (found!==-1){ animateExit(idx,found,slots[idx][found]); done=true; break; }
        }
        if (!done) {
          for (let i=0;i<FLOORS;i++){
            const idx=(fi+i)%FLOORS;
            if (findEmpty(idx)!==-1){ animateEnter(idx, findEmpty(idx), Math.random()<0.3?'motor':'car'); break; }
          }
        }
      }
    }, 2400);
  }
  function stopAuto() {
    if (autoInterval){clearInterval(autoInterval);autoInterval=null;}
    autoActive=false;
    autoSwitch.classList.remove('active');
    showToast('⏸ Simulasi otomatis berhenti','info');
  }
  function toggleAuto(){ autoActive?stopAuto():startAuto(); }

  // ===== INIT =====
  function init() {
    render();
    enterBtn.addEventListener('click', ()=>{
      const fi = parseInt(floorSelector.value,10);
      if (!addVehicleAuto(fi)) {
        showToast(`❌ Lantai ${fi+1} penuh!`,'error');
        beep(200,0.15,'sawtooth');
      }
    });
    exitBtn.addEventListener('click', ()=>{
      const fi = parseInt(floorSelector.value,10);
      if (!removeVehicle(fi)) {
        showToast(`❌ Lantai ${fi+1} kosong!`,'error');
        beep(200,0.15,'sawtooth');
      }
    });
    resetAllBtn.addEventListener('click', resetAll);
    autoSwitch.addEventListener('click', toggleAuto);

    document.addEventListener('keydown', e=>{
      if (e.target.tagName==='SELECT') return;
      if (e.key==='Enter'){e.preventDefault();enterBtn.click();}
      if (e.key==='Backspace'){e.preventDefault();exitBtn.click();}
      if (e.key==='r'||e.key==='R') resetAllBtn.click();
    });
    window.addEventListener('beforeunload', ()=>{ if(autoInterval) clearInterval(autoInterval); });
  }

  init();
})();
</script>
</body>
</html>
